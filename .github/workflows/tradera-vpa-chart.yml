name: Tradera VPA chart

on:
  push:
    tags: ["vpa-tradera-v*"]
  pull_request:
    paths:
      - "vertical-pod-autoscaler/charts/vertical-pod-autoscaler/**"
      - ".github/workflows/tradera-vpa-chart.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Chart and app version to publish (without leading v). Required."
        required: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Resolve version
        id: ver
        run: |
          case "${{ github.event_name }}" in
            workflow_dispatch)
              VERSION="${{ inputs.version }}"
              ;;
            pull_request)
              # PR builds validate the chart but don't publish. Synthesize a
              # version so `helm package` produces a deterministic artifact
              # name without colliding with real releases.
              VERSION="0.0.0-pr.${{ github.event.pull_request.number }}.${GITHUB_SHA::7}"
              ;;
            *)
              # tag refs/tags/vpa-tradera-v0.9.0  →  0.9.0
              VERSION="${GITHUB_REF_NAME#vpa-tradera-v}"
              ;;
          esac
          if [ -z "$VERSION" ]; then
            echo "version is empty" >&2; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # The image tag the workflow Tradera VPA images publishes is the
          # full git tag (e.g. vpa-tradera-v0.9.0). Pin appVersion to that
          # so `helm install` of this chart pulls the matching images
          # without an explicit image.tag override.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "appVersion=$VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "appVersion=vpa-tradera-v$VERSION" >> "$GITHUB_OUTPUT"
          fi

      - name: Lint
        run: helm lint vertical-pod-autoscaler/charts/vertical-pod-autoscaler

      - name: Package
        run: |
          helm package vertical-pod-autoscaler/charts/vertical-pod-autoscaler \
            --version "${{ steps.ver.outputs.version }}" \
            --app-version "${{ steps.ver.outputs.appVersion }}" \
            --destination .

      - name: Upload chart artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: vertical-pod-autoscaler-${{ steps.ver.outputs.version }}
          path: vertical-pod-autoscaler-${{ steps.ver.outputs.version }}.tgz
          if-no-files-found: error

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push
        if: github.event_name != 'pull_request'
        run: |
          helm push "vertical-pod-autoscaler-${{ steps.ver.outputs.version }}.tgz" \
            "oci://ghcr.io/${{ github.repository }}/charts"

      - name: Summary
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "### Chart published"
            echo
            echo "    helm install my-vpa oci://ghcr.io/${{ github.repository }}/charts/vertical-pod-autoscaler --version ${{ steps.ver.outputs.version }}"
            echo
            echo "Resolves to images tagged \`${{ steps.ver.outputs.appVersion }}\` (override per-component with \`--set <component>.image.tag=...\`)."
          } >> "$GITHUB_STEP_SUMMARY"
