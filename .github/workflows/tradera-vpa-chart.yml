name: Tradera VPA chart

on:
  push:
    tags: ["vpa-tradera-v*"]
  pull_request:
    paths:
      - "vertical-pod-autoscaler/charts/vertical-pod-autoscaler/**"
      - ".github/workflows/tradera-vpa-chart.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Chart and app version to publish (without leading v). Required."
        required: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Resolve version
        id: ver
        run: |
          case "${{ github.event_name }}" in
            workflow_dispatch)
              VERSION="${{ inputs.version }}"
              APPVERSION="vpa-tradera-v$VERSION"
              ;;
            pull_request)
              # PR builds produce a pre-release chart pinned to the image
              # built for the PR head commit (the Tradera VPA images
              # workflow tags those with the 7-char short sha).
              HEAD_SHA="${{ github.event.pull_request.head.sha }}"
              VERSION="0.0.0-pr.${{ github.event.pull_request.number }}.${HEAD_SHA:0:7}"
              APPVERSION="${HEAD_SHA:0:7}"
              ;;
            *)
              # tag refs/tags/vpa-tradera-v0.9.0  →  0.9.0
              VERSION="${GITHUB_REF_NAME#vpa-tradera-v}"
              # Tag image is published with the full git tag; pin appVersion
              # to that so `helm install` resolves images without an explicit
              # image.tag override.
              APPVERSION="vpa-tradera-v$VERSION"
              ;;
          esac
          if [ -z "$VERSION" ]; then
            echo "version is empty" >&2; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "appVersion=$APPVERSION" >> "$GITHUB_OUTPUT"

      - name: Lint
        run: helm lint vertical-pod-autoscaler/charts/vertical-pod-autoscaler

      - name: Package
        run: |
          helm package vertical-pod-autoscaler/charts/vertical-pod-autoscaler \
            --version "${{ steps.ver.outputs.version }}" \
            --app-version "${{ steps.ver.outputs.appVersion }}" \
            --destination .

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push
        run: |
          helm push "vertical-pod-autoscaler-${{ steps.ver.outputs.version }}.tgz" \
            "oci://ghcr.io/${{ github.repository }}/charts"

      - name: Summary
        run: |
          {
            echo "### Chart published"
            echo
            echo "    helm install my-vpa oci://ghcr.io/${{ github.repository }}/charts/vertical-pod-autoscaler --version ${{ steps.ver.outputs.version }}"
            echo
            echo "Resolves to images tagged \`${{ steps.ver.outputs.appVersion }}\` (override per-component with \`--set <component>.image.tag=...\`)."
          } >> "$GITHUB_STEP_SUMMARY"
